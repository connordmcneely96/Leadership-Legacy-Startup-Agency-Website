# Cloudflare Workers Configuration for Leadership Legacy
# This file is for the Workers API only
# Pages (Next.js) deployment uses CLI or dashboard (no wrangler.toml needed)

name = "leadership-legacy"
main = "workers/api/index.ts"
compatibility_date = "2025-01-01"
account_id = "d3dbdd3e1ebbc28edf0ce756d9841490"

# Node.js compatibility for Workers
compatibility_flags = ["nodejs_compat"]

# D1 Database - Contact submissions and analytics
[[d1_databases]]
binding = "DB"
database_name = "leadership-legacy-db"
database_id = "c593cef5-5921-4016-93c6-75361de39b2a"

# R2 Bucket - Media assets
[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "leadership-legacy-assets"

# Workers AI - AI Assistant integration
[ai]
binding = "AI"

# KV Namespace - Configuration and feature flags
[[kv_namespaces]]
binding = "CONFIG"
id = "a82cf78ed3eb4422b6ac86c4891d76d5"

# Environment variables
# JWT_SECRET is NOT set here. It is a Worker secret:
#   production: set from the JWT_SECRET GitHub secret by .github/workflows/cloudflare.yml
#   local dev:  add JWT_SECRET to an untracked .dev.vars.local / your shell, never commit it
[vars]
ENVIRONMENT = "development"
NEXT_PUBLIC_API_URL = "https://leadership-legacy.YOUR_SUBDOMAIN.workers.dev"

# Production environment
# Bindings are not inherited by environments, so they are repeated here.
[env.production]
name = "leadership-legacy-production"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "leadership-legacy-db"
database_id = "c593cef5-5921-4016-93c6-75361de39b2a"

[[env.production.r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "leadership-legacy-assets"

[env.production.ai]
binding = "AI"

[[env.production.kv_namespaces]]
binding = "CONFIG"
id = "a82cf78ed3eb4422b6ac86c4891d76d5"
